spring.application.name=provid
server.port=8080

# --- Base de données : H2 en mémoire (démo, aucune installation requise) ---
spring.datasource.url=jdbc:h2:mem:provid;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (production) : décommenter et adapter ---
# spring.datasource.url=jdbc:mysql://localhost:3306/provid?useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=motdepasse
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

spring.jpa.show-sql=false

# Clé API Gemini (recommandations nutrition) — facultatif
gemini.api.key=${GEMINI_API_KEY:}
